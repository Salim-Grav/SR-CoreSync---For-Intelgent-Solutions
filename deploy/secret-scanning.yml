name: Sovereign Secret Scanning & IP Protection

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  scan-secrets:
    name: Audit Repository Credentials & Private Keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run S&R CoreSync Sovereign Secret Scanner
        run: python scripts/audit_secrets.py

      - name: Verify Strict Gitignore Enforcement (.env & .secrets)
        run: |
          set -e
          echo "Verifying that zero secret or environment files are tracked..."
          for forbidden in .env .env.local .env.production .secrets/master.key id_rsa id_ed25519; do
            if git ls-files --error-unmatch "$forbidden" > /dev/null 2>&1; then
              echo "::error::CRITICAL SECURITY BREACH: '$forbidden' is tracked in Git!"
              exit 1
            fi
          done
          echo "Verified: Zero sensitive environment files tracked in Git."
