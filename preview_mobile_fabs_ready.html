<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dananajmah-bundle.min.css">
    <link rel="stylesheet" href="css/enterprise-suite.css">
</head>
<body style="background: #010907; height: 100vh; overflow: hidden; padding: 20px; box-sizing: border-box; color: #fff;">
    <script>localStorage.setItem('coresync_gdpr_status', 'accepted');</script>
    <div style="padding-top: 20px;">
        <span style="color: #c5a880; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;">ENTERPRISE MOBILE VIEW</span>
        <h1 style="font-size: 1.4rem; font-weight: 800; line-height: 1.3; margin: 10px 0; color: #fff;">
            S&R CoreSync <span style="color: #c5a880;">Mobile Architecture</span>
        </h1>
        <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; line-height: 1.5;">
            Notice the 3 compact circular interactive touch FABs on the bottom right corner (44px touch targets). Zero obstruction of page content!
        </p>
    </div>
    <script src="css/enterprise-suite.js"></script>

<div id="style_dump" style="color:red; font-size:12px;"></div>
<script>
window.addEventListener('load', () => {
    const el = document.getElementById('esFloatingSuite');
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    const fab = el.querySelector('.es-feedback-fab');
    const fab_cs = getComputedStyle(fab);
    const fab_r = fab.getBoundingClientRect();
    document.getElementById('style_dump').textContent = JSON.stringify({
        suite_r: {top: r.top, bottom: r.bottom, left: r.left, right: r.right, w: r.width, h: r.height},
        suite_pos: cs.position,
        suite_disp: cs.display,
        suite_bottom: cs.bottom,
        suite_right: cs.right,
        fab_disp: fab_cs.display,
        fab_w: fab_cs.width,
        fab_h: fab_cs.height,
        fab_r: {top: fab_r.top, left: fab_r.left, w: fab_r.width, h: fab_r.height}
    });
});
</script>
</body>

</html>
