<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&R CloudPOS Connector v3.1 // Standalone POS Terminal</title>
    <style>
        :root {
            --bg-deep: #030806;
            --bg-card: #081410;
            --gold: #c5a880;
            --emerald: #10b981;
            --border: rgba(197, 168, 128, 0.22);
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-deep); color: #fff; padding: 24px; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; flex: 1; }
        @media(max-width: 850px){ .grid { grid-template-columns: 1fr; } }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
        .prod-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 12px 6px; text-align: center; color: #fff; cursor: pointer; }
        .prod-btn:hover { background: rgba(16,185,129,0.2); border-color: var(--emerald); }
        .slip { background: #fff8e7; color: #111; font-family: 'Courier New', monospace; padding: 16px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); font-size: 0.85rem; }
        .slip-header { text-align: center; border-bottom: 1px dashed #666; padding-bottom: 8px; margin-bottom: 10px; }
        .slip-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .slip-total { border-top: 1px solid #111; padding-top: 6px; margin-top: 6px; font-weight: 800; font-size: 1.05rem; }
        .btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
        .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--border); }
        .header-title { font-size: 1.25rem; font-weight: 800; }
        .header-subtitle { font-size: 0.8rem; color: var(--text-dim); }
        .header-status { color: var(--emerald); font-weight: 700; font-size: 0.85rem; }
        .card-title { font-size: 1rem; color: var(--gold); margin-bottom: 12px; }
        .barcode { text-align: center; margin-top: 8px; font-size: 0.75rem; font-family: monospace; letter-spacing: 2px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 class="header-title">⚡ S&R CloudPOS Connector v3.1</h1>
            <span class="header-subtitle">محطة كاشير ونقاط بيع متصلة بالـ ERP أوفلاين وسحابياً</span>
        </div>
        <span class="header-status">● متصل بالسحابة (AMS-01)</span>
    </header>

    <div class="grid">
        <div class="card">
            <h3 class="card-title">قائمة المنتجات (انقر للإضافة):</h3>
            <div class="products-grid">
                <button class="prod-btn" onclick="add('قهوة اسبريسو', 3.50, 0.09)">☕ قهوة<br><strong>€ 3.50</strong></button>
                <button class="prod-btn" onclick="add('شطيرة غداء', 7.50, 0.09)">🥪 غداء<br><strong>€ 7.50</strong></button>
                <button class="prod-btn" onclick="add('استشارة محاسبية', 120.00, 0.21)">💼 استشارة<br><strong>€ 120.00</strong></button>
                <button class="prod-btn" onclick="add('محطة كاشير POS', 250.00, 0.21)">🖥️ كاشير<br><strong>€ 250.00</strong></button>
            </div>
            <button class="btn btn-secondary" onclick="clearCart()">إفراغ السلة 🗑️</button>
        </div>

        <div class="card">
            <div class="slip">
                <div class="slip-header">
                    <strong>S&R CLOUDPOS TERMINAL</strong><br>
                    <span>Store #104 • Amsterdam</span>
                </div>
                <div id="slipItems">
                    <div class="slip-row"><span>2x قهوة اسبريسو</span><span>€ 7.00</span></div>
                </div>
                <div class="slip-row slip-total">
                    <span>المجموع الإجمالي:</span>
                    <strong id="slipTot">€ 7.00</strong>
                </div>
                <div class="barcode">||| | |||| | ||| ||||</div>
            </div>
            <button class="btn" onclick="pay()">إتمام الدفع وطباعة الإيصال 🖨️</button>
        </div>
    </div>

    <script>
        let items = [{ name: 'قهوة اسبريسو', price: 3.50, qty: 2 }];
        function render() {
            let tot = 0;
            const container = document.getElementById('slipItems');
            container.innerHTML = items.map(i => {
                tot += i.price * i.qty;
                return `<div class="slip-row"><span>${i.qty}x ${i.name}</span><span>€ ${(i.price * i.qty).toFixed(2)}</span></div>`;
            }).join('');
            document.getElementById('slipTot').innerText = `€ ${tot.toFixed(2)}`;
        }
        function add(n, p, v) {
            const f = items.find(x => x.name === n);
            if (f) f.qty++;
            else items.push({ name: n, price: p, qty: 1 });
            render();
        }
        function clearCart() { items = []; render(); }
        function pay() { alert('🎉 تم إتمام الدفع بنجاح وترحيل القيد للـ ERP وطباعة الإيصال!'); }
        render();
    </script>
</body>
</html>
