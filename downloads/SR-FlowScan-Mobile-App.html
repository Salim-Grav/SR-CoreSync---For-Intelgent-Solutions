<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&R FlowScan AI Mobile v1.8 // Standalone OCR App</title>
    <style>
        :root {
            --bg-deep: #030806;
            --bg-card: #081410;
            --gold: #c5a880;
            --emerald: #10b981;
            --border: rgba(197, 168, 128, 0.22);
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-deep); color: #fff; padding: 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .frame { max-width: 440px; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
        .title { font-size: 1.15rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .scanner-box { height: 200px; background: radial-gradient(circle, #0b221a, #030806); border: 2px dashed rgba(16,185,129,0.5); border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; margin-bottom: 16px; }
        .laser { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #10b981; box-shadow: 0 0 12px #10b981; animation: scan 2s infinite alternate; }
        @keyframes scan { 0% { top: 5%; } 100% { top: 92%; } }
        .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
        .preset-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; padding: 8px 4px; border-radius: 8px; font-size: 0.72rem; cursor: pointer; }
        .preset-btn.active, .preset-btn:hover { background: rgba(16,185,129,0.25); border-color: var(--emerald); }
        .res-box { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; }
        .row.total { border-top: 1px dashed var(--gold); padding-top: 8px; margin-top: 8px; font-size: 1rem; font-weight: 800; color: var(--gold); }
        .btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 800; cursor: pointer; font-size: 0.9rem; margin-bottom: 8px; }
        .btn-sec { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; }
        .pwa-badge { font-size: 0.75rem; color: var(--emerald); font-weight: 700; }
        .cam-icon { font-size: 2rem; margin-bottom: 6px; }
        .scan-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
        .cat-pill { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="header">
            <div class="title">📱 S&R FlowScan AI v1.8</div>
            <span class="pwa-badge">PWA Standalone</span>
        </div>

        <div class="scanner-box">
            <div class="laser"></div>
            <div class="cam-icon">📸</div>
            <strong id="fsTitle">مسح ضوئي ذكي للإيصالات</strong>
            <p class="scan-sub">استخراج تلقائي لضريبة الـ BTW والمبالغ</p>
        </div>

        <div class="presets">
            <button class="preset-btn active" onclick="pick('shell', this)">⛽ Shell<br>€ 84.50</button>
            <button class="preset-btn" onclick="pick('ah', this)">🏢 Albert Heijn<br>€ 38.20</button>
            <button class="preset-btn" onclick="pick('restaurant', this)">🍽️ De Kas<br>€ 142.00</button>
        </div>

        <div class="res-box">
            <div class="row"><span>المتجر:</span><strong id="rStore">Shell Express Amsterdam</strong></div>
            <div class="row"><span>التاريخ:</span><strong id="rDate">2026-10-20 14:22</strong></div>
            <div class="row"><span>التصنيف:</span><strong id="rCat" class="cat-pill">وقود وأسطول نقل</strong></div>
            <div class="row"><span>الضريبة:</span><strong id="rVat">€ 14.67 (21%)</strong></div>
            <div class="row total"><span>المجموع الكلي:</span><strong id="rTotal">€ 84.50</strong></div>
        </div>

        <button class="btn" onclick="syncErp()">🚀 مزامنة فورية مع السحابة</button>
        <button class="btn btn-sec" onclick="exportJson()">📥 تصدير ملف JSON</button>
    </div>

    <script>
        const P = {
            shell: { store: 'Shell Express Amsterdam', date: '2026-10-20 14:22', cat: 'وقود وأسطول نقل', vat: '€ 14.67 (21%)', tot: '€ 84.50' },
            ah: { store: 'Albert Heijn Zakelijk', date: '2026-10-20 11:05', cat: 'أدوات ومستلزمات مكتبية', vat: '€ 3.15 (9%)', tot: '€ 38.20' },
            restaurant: { store: 'Restaurant De Kas Amsterdam', date: '2026-10-19 20:45', cat: 'ضيافة واجتماعات شركاء', vat: '€ 11.72 (9%)', tot: '€ 142.00' }
        };
        let curr = 'shell';

        function pick(k, btn) {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            curr = k;
            const d = P[k];
            document.getElementById('rStore').innerText = d.store;
            document.getElementById('rDate').innerText = d.date;
            document.getElementById('rCat').innerText = d.cat;
            document.getElementById('rVat').innerText = d.vat;
            document.getElementById('rTotal').innerText = d.tot;
        }

        function syncErp() {
            alert('✓ تم ترحيل بيانات الإيصال بنجاح إلى نظام CoreSync Cloud ERP!');
        }

        function exportJson() {
            const d = P[curr];
            const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Receipt_${curr}.json`;
            a.click();
        }
    </script>
</body>
</html>
