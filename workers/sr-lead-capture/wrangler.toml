name = "sr-lead-capture"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# -----------------------------------------------------------------------------
# S&R CoreSync Solutions - Sovereign Lead Capture Worker
# -----------------------------------------------------------------------------
# Deploy:   npx wrangler deploy
# Secrets:  npx wrangler secret put PURELYMAIL_PASS   (mailbox password - the only secret needed)
#           npx wrangler secret put LEAD_WEBHOOK_URLS   (relay to n8n/Make, optional)
#           npx wrangler secret put RESEND_API_KEY      (fallback provider, optional)
#           npx wrangler secret put BREVO_API_KEY       (fallback provider, optional)
#           npx wrangler secret put EMAIL_WEBHOOK_URL   (generic relay, optional)
#
# Email delivery order: SEND_EMAIL binding -> Purelymail SMTP -> Resend -> Brevo -> webhook
# Purelymail SMTP (smtp.purelymail.com:587, STARTTLS) needs no extra vendor: port 25 is
# blocked in Workers, 587 is not. PURELYMAIL_USER is both the login and the From address.
#
# KV namespace (optional but recommended):
#   npx wrangler kv namespace create LEADS
#   then paste the returned id below.
# -----------------------------------------------------------------------------

[observability]
enabled = true

[vars]
LEAD_WEBHOOK_URLS = "https://hook.eu1.make.com/الرابط-الحقيقي"
ALLOWED_ORIGINS = "https://sr-coresync.com,https://www.sr-coresync.com,https://salim-grav.github.io,http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080,http://127.0.0.1:8099,http://localhost:8099"
MAIL_FROM = "info@sr-coresync.com"
# Mailbox that sends alerts. Its password is the PURELYMAIL_PASS secret.
PURELYMAIL_USER = "info@sr-coresync.com"
# Where lead alerts land. A plain address is not sensitive, so it lives here.
NOTIFY_EMAIL = "info@sr-coresync.com"
CONTRACT_RECIPIENTS = "mudar@nlbilarabi.nl,info@sr-coresync.com,info@sr-coresync.nl,finance@sr-coresync.nl"
# Public activity stream on the site. Leave unset (off) until the feed is ready.
EVENTS_PUBLIC = "1"
# Turnstile: soft-fail until the widget ships, then flip to hard enforcement.
# TURNSTILE_ENFORCE = "1"

[[kv_namespaces]]
binding = "LEADS"
id = "d23f177169fb4501b854056e67d21ed5"

# -----------------------------------------------------------------------------
# D1 - durable system of record for leads, payments and consent evidence.
# Create it once, paste the returned id, then apply migrations/0001_init.sql:
#   npx wrangler d1 create sr-coresync
#   npx wrangler d1 execute sr-coresync --remote --file=migrations/0001_init.sql
# The worker writes to D1 only when this binding exists, so it stays safe to
# deploy without it.
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sr-coresync"
database_id = "d37e7e82-88cd-4ba8-b207-86b94490eff8"

# -----------------------------------------------------------------------------
# Custom domain (recommended): api.sr-coresync.com
# Uncomment after the domain is added in the Cloudflare dashboard.
# -----------------------------------------------------------------------------
# routes = [
#   { pattern = "api.sr-coresync.com", custom_domain = true }
# ]

# -----------------------------------------------------------------------------
# Alternative: same-origin route on the apex domain.
# Requires sr-coresync.com to be proxied by Cloudflare.
# This route takes precedence over the GitHub Pages deployment for /api/*.
# -----------------------------------------------------------------------------
# routes = [
#   { pattern = "sr-coresync.com/api/*", zone_name = "sr-coresync.com" }
# ]
