# Pyrefly configuration for S&R CoreSync For Intelligent Solutions
# Tells Pyrefly where to find Python packages for type-checking

[python]
# Use the project's virtual environment as the primary interpreter
python_interpreter = ".venv/Scripts/python.exe"

# Include global user packages and system packages as search paths
# so Pyrefly can resolve fastapi, pdfplumber, python-docx, etc.
search_paths = [
    "C:/Users/msali/AppData/Roaming/Python/Python314/site-packages",
    "C:/Program Files/Python314/Lib/site-packages",
    "C:/Program Files/Python314/DLLs",
    ".venv/Lib/site-packages",
]
