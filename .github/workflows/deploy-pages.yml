name: Deploy S&R CoreSync Solutions to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Informational only. Reports the publishing source of the Pages site.
  #
  # With the legacy "Deploy from a branch" build type, GitHub publishes the
  # branch tree verbatim and server-side material becomes publicly reachable.
  # Note: GitHub Pages ignores the `_headers` file in every build type; real
  # security headers require a proxy (Cloudflare) in front of the site.
  # -----------------------------------------------------------------------
  pages-source:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: read
    steps:
      - name: Read the Pages publishing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{os.environ['GH_REPO']}/pages"
          req = urllib.request.Request(api, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
          except urllib.error.HTTPError as exc:
              print(f"Could not read the Pages configuration: HTTP {exc.code}")
              raise SystemExit(0)
          except Exception as exc:  # never fail the pipeline for an info probe
              print(f"Pages configuration probe skipped: {exc}")
              raise SystemExit(0)

          build_type = data.get("build_type")
          cname = data.get("cname")
          source = data.get("source") or {}
          print(f"build_type = {build_type}")
          print(f"cname      = {cname}")
          print(f"source     = {source.get('branch')} {source.get('path')}")
          if build_type != "workflow":
              print("::warning::The Pages site is still built from the branch. "
                    "Everything in the branch - including server-side material - "
                    "is published. Switch Settings > Pages > Build and deployment "
                    "> Source to 'GitHub Actions'.")
              raise SystemExit(0)
          print("Publishing source is 'GitHub Actions': only the selective "
                "publish set is served.")
          PY

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------
      # Ensure the Pages site is built by GitHub Actions.
      #
      # With the legacy "Deploy from a branch" build type, GitHub Pages
      # publishes the branch tree verbatim: every file is reachable
      # (server-side material included) and the _headers file is served as a
      # plain file instead of being applied by the CDN.
      #
      # The GITHUB_TOKEN of this workflow carries the "pages: write"
      # permission, so the publishing source can be switched to
      # "GitHub Actions" without any manual step.
      # ---------------------------------------------------------------------
      - name: Ensure Pages build type is workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          api = f"https://api.github.com/repos/{repo}/pages"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(method, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(api, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read().decode() or "{}"
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()

          status, body = call("GET")
          print(f"GET /pages -> {status}")
          if status != 200:
              print(body[:500])
              sys.exit(0)

          current = json.loads(body)
          print(f"current build_type = {current.get('build_type')!r}")
          if current.get("build_type") == "workflow":
              print("Pages source is already 'GitHub Actions'.")
              sys.exit(0)

          payload = {"build_type": "workflow"}
          # Preserve the custom domain so the switch never drops sr-coresync.com.
          cname = current.get("cname")
          if cname:
              payload["cname"] = cname
          print(f"PUT /pages payload = {payload}")

          status, body = call("PUT", payload)
          print(f"PUT /pages -> {status}")
          print(body[:800])
          if status not in (200, 204):
              print("::warning::Could not switch the Pages source automatically. "
                    "Set Settings > Pages > Source to 'GitHub Actions' manually.")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------------
      # Selective publish.
      # GitHub Pages serves whatever is inside the uploaded artifact. The
      # repository also contains server-side material (legacy PHP gateway,
      # Cloudflare Worker sources, webhook/payment configuration, deployment
      # tooling and the 27 MB production archive) that must NEVER be
      # reachable from the public domain.
      #
      # The rules live in scripts/publish_set.py, which is also used by the
      # CI validation job - so the verified artifact is the published one.
      # ---------------------------------------------------------------------
      - name: Build publish set
        run: python scripts/prepare_publish_set.py

      # ---------------------------------------------------------------------
      # Guard: fail the deployment if anything sensitive slipped through.
      # ---------------------------------------------------------------------
      - name: Verify no server-side material is published
        run: |
          set -euo pipefail
          forbidden=(api config workers scripts dist .htaccess .env .env.example .github)
          failed=0
          for entry in "${forbidden[@]}"; do
            if [ -e "_site/$entry" ]; then
              echo "::error::Forbidden path published: $entry"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "Publish guard passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
