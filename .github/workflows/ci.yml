name: S&R CoreSync CI & Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ ships a global WebSocket, required by the DevTools
          # protocol client used in the browser console audit.
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify HTML & CSS Syntax Integrity
        run: node scripts/validate.js

      - name: Verify JavaScript Syntax (all non-minified modules)
        run: |
          set -e
          failed=0
          while IFS= read -r file; do
            node --check "$file" || failed=1
          done < <(find js workers -name '*.js' -not -path '*/node_modules/*')
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All JavaScript modules parsed successfully."

      - name: Verify Inline Script & JSON-LD Syntax
        run: node scripts/check_inline_scripts.mjs

      - name: Audit JavaScript Identifier Integrity
        run: python scripts/audit_js_identifiers.py

      # Guards the exact failure class seen in Oct 2026: a template batch
      # shipped the Launchpad button markup while the inline controller block
      # defining window.toggleAppleDockLaunchpad was dropped - every click
      # threw ReferenceError. Engine-agnostic invariant: any page that CALLS
      # the handler from markup must DEFINE it in the same page.
      - name: Audit Dock Handler Sync (markup requires definition)
        run: python scripts/check_dock_handler.py

      - name: Audit Cross-language API Parity
        run: python scripts/audit_language_api_parity.py

      - name: Test the Cloudflare Lead Capture Worker
        run: node scripts/test_lead_worker.mjs

      - name: Audit Localized Relative Paths
        run: python scripts/audit_language_paths.py

      # Catches the Oct 2026 regression where rewritten landing pages declared
      # og:locale=en_US (or legacy ar_SA) regardless of their html lang.
      - name: Audit og:locale vs page language
        run: python scripts/fix_og_locale.py --check

      # Protects the SEO discovery assets (IndexNow key file, RFC 6350 vCard,
      # OfferCatalog JSON-LD) against silent loss in template batches.
      - name: Audit SEO discovery assets
        run: python scripts/check_seo_assets.py

      - name: Verify Supply Chain Keys
        run: python scripts/verify_supply_chain_keys.py

      - name: Build the publish artifact
        run: python scripts/prepare_publish_set.py

      - name: Build & Verify Transactional E-mails
        run: python scripts/build_email_templates.py

      - name: Verify CSP hash manifest is in sync
        run: python scripts/build_csp.py --check

      - name: Performance budget (production-like compression)
        run: python scripts/check_perf_budget.py

      - name: Check Local Link Integrity (publish set)
        run: python scripts/check_site_links.py

      - name: Browser console audit (headless Chromium)
        run: node scripts/browser_console_audit.mjs

      - name: Verify Dead PHP Gateway Is Not Referenced
        run: python scripts/audit_dead_gateway.py

      - name: Verify Required Publish Artifacts Exist
        run: |
          set -e
          for f in _headers .nojekyll CNAME sitemap.xml robots.txt manifest.json sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
          done
          echo "Required publish artifacts present."

      - name: Security & GDPR Compliance Check
        run: |
          echo "Checking manifest and PWA readiness..."
          if [ -f "manifest.json" ]; then
            echo "PWA manifest present and valid."
          fi
          echo "Checking that server-side material stays out of the publish set..."
          for forbidden in api config workers scripts dist .htaccess .env; do
            if [ -e "$forbidden" ]; then
              echo "::warning::$forbidden is tracked in the repository but is excluded by the publish workflow."
            fi
          done
