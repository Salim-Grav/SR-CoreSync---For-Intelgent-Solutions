<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&R CoreSync — Animated Banner</title>
<link rel="preload" as="image" href="slide1.webp" type="image/webp">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050505;font-family:system-ui,sans-serif}
.banner{position:relative;width:100%;aspect-ratio:1672/941;min-height:230px;overflow:hidden;background:#030303;isolation:isolate}
.slide{position:absolute;inset:0;opacity:0;animation:show 18s infinite;will-change:opacity}
.slide:nth-child(2){animation-delay:6s}.slide:nth-child(3){animation-delay:12s}
.slide picture{display:block;width:100%;height:100%}
.slide img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 18s ease-in-out infinite;transform-origin:center}
.slide:nth-child(2) img{animation-delay:6s}.slide:nth-child(3) img{animation-delay:12s}
@keyframes show{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
@keyframes zoom{0%{transform:scale(1)}30%{transform:scale(1.045)}100%{transform:scale(1)}}
.gold-light{position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(245,184,70,.075) 49%,transparent 66%);mix-blend-mode:screen;animation:shimmer 9s ease-in-out infinite;z-index:2}
@keyframes shimmer{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
.controls{position:absolute;z-index:3;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;direction:ltr}
.controls button{width:27px;height:5px;padding:0;border:0;border-radius:8px;background:#ffffff65;cursor:pointer}
.controls button.active{background:#edbd63}
@media(max-width:700px){.banner{aspect-ratio:16/9;min-height:0}.controls{bottom:5px}}
@media(prefers-reduced-motion:reduce){.slide,.slide img,.gold-light{animation:none!important}.slide:first-child{opacity:1}}
@media (hover: none) and (min-width: 1200px), tv {
    .gold-light { display: none !important; }
}
</style>
</head>
<body>
<section class="banner" aria-label="عرض S&R CoreSync المتحرك">
  <div class="slide">
    <picture>
      <source srcset="slide1.webp" type="image/webp">
      <img src="slide1.jpg" alt="S&R CoreSync — For Intelligent Solutions" width="1672" height="941" loading="eager">
    </picture>
  </div>
  <div class="slide">
    <picture>
      <source srcset="slide2.webp" type="image/webp">
      <img src="slide2.jpg" alt="م. محمد سليم عزيزة — الأنظمة البرمجية والذكاء الاصطناعي" width="1672" height="941" loading="lazy">
    </picture>
  </div>
  <div class="slide">
    <picture>
      <source srcset="slide3.webp" type="image/webp">
      <img src="slide3.jpg" alt="أ. محمد رائد كعكة — الحلول المالية وأنظمة ERP" width="1672" height="941" loading="lazy">
    </picture>
  </div>
  <div class="gold-light" aria-hidden="true"></div>
  <nav class="controls" aria-label="الشرائح"><button aria-label="الشعار"></button><button aria-label="المسؤول التقني"></button><button aria-label="المسؤول المالي"></button></nav>
</section>
<script>
const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.controls button')];
let current=0,manual=false,interval;
function showSlide(i){manual=true;current=i;slides.forEach((s,n)=>{s.style.animation='none';s.style.opacity=n===i?'1':'0';s.querySelector('img').style.animation='none'});dots.forEach((d,n)=>d.classList.toggle('active',n===i))}
function startManual(){clearInterval(interval);interval=setInterval(()=>showSlide((current+1)%3),6000)}
dots.forEach((d,i)=>d.addEventListener('click',()=>{showSlide(i);startManual()}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setInterval(()=>{if(!manual){dots.forEach((d,i)=>d.classList.toggle('active',i===Math.floor((performance.now()/6000)%3))) }},400)}else dots[0].classList.add('active');
</script>
</body>
</html>
