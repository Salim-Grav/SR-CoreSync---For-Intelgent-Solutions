<svg viewBox="0 0 500 500" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&amp;display=swap');
      .emblem-ar-main {
        font-family: 'Cairo', 'Tahoma', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        text-anchor: middle;
      }
      .emblem-ar-sub {
        font-family: 'Cairo', 'Tahoma', sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: url(#goldTextGrad);
        text-anchor: middle;
      }
    </style>

    <radialGradient id="obsidianDiscGrad" cx="46%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#24252b" stop-opacity="0.98" />
      <stop offset="42%" stop-color="#14151a" stop-opacity="0.99" />
      <stop offset="78%" stop-color="#090a0d" stop-opacity="1" />
      <stop offset="100%" stop-color="#020304" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="goldBezelGrad" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#8c6633" />
      <stop offset="15%" stop-color="#d8b780" />
      <stop offset="28%" stop-color="#fff9ec" />
      <stop offset="45%" stop-color="#c5a880" />
      <stop offset="62%" stop-color="#734e20" />
      <stop offset="82%" stop-color="#e2c595" />
      <stop offset="100%" stop-color="#916a37" />
    </linearGradient>

    <linearGradient id="goldRimInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3db" />
      <stop offset="50%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#6e4d21" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eed8b6" />
      <stop offset="50%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#dfbe8a" />
    </linearGradient>

    <linearGradient id="orbitLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c5a880" stop-opacity="0.45" />
    </linearGradient>

    <radialGradient id="sphereNodeGrad" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff2d4" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#7e5723" />
      <stop offset="100%" stop-color="#321c07" />
    </radialGradient>

    <linearGradient id="starFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdf2db" />
      <stop offset="100%" stop-color="#dfbe8e" />
    </linearGradient>
    <linearGradient id="starFacetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed5ac" />
      <stop offset="60%" stop-color="#c8a571" />
      <stop offset="100%" stop-color="#947340" />
    </linearGradient>
    <linearGradient id="starFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aa8650" />
      <stop offset="60%" stop-color="#785527" />
      <stop offset="100%" stop-color="#493213" />
    </linearGradient>

    <filter id="letterDepthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="nodeHaloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feFlood flood-color="#c5a880" flood-opacity="0.45" result="color" />
      <feComposite in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="official-emblem-master">
    <circle cx="250" cy="250" r="240" fill="none" stroke="#c5a880" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="2 6" />
    <circle cx="250" cy="250" r="226" fill="none" stroke="#c5a880" stroke-opacity="0.25" stroke-width="0.6" />
    <line x1="15" y1="250" x2="485" y2="250" stroke="#c5a880" stroke-opacity="0.22" stroke-width="0.6" />
    <line x1="250" y1="15" x2="250" y2="485" stroke="#c5a880" stroke-opacity="0.22" stroke-width="0.6" />

    <ellipse cx="250" cy="250" rx="226" ry="96" transform="rotate(-33 250 250)" fill="none" stroke="url(#orbitLineGrad)" stroke-width="1.3" stroke-opacity="0.75" />
    <ellipse cx="250" cy="250" rx="226" ry="96" transform="rotate(33 250 250)" fill="none" stroke="url(#orbitLineGrad)" stroke-width="1.3" stroke-opacity="0.75" />
    <circle cx="250" cy="250" r="192" fill="none" stroke="#c5a880" stroke-opacity="0.22" stroke-width="0.6" stroke-dasharray="6 12" />

    <g transform="translate(424, 138)" filter="url(#nodeHaloGlow)">
      <circle cx="0" cy="0" r="14.5" fill="url(#sphereNodeGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.85" />
      <circle cx="-3" cy="-4" r="3.5" fill="#ffffff" opacity="0.65" />
    </g>
    <g transform="translate(76, 362)" filter="url(#nodeHaloGlow)">
      <circle cx="0" cy="0" r="14.5" fill="url(#sphereNodeGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.85" />
      <circle cx="-3" cy="-4" r="3.5" fill="#ffffff" opacity="0.65" />
    </g>

    <circle cx="250" cy="254" r="165" fill="#000000" opacity="0.55" filter="blur(8px)" />
    <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldBezelGrad)" stroke-width="9" />
    <circle cx="250" cy="250" r="156.8" fill="none" stroke="#090a0d" stroke-width="1.8" />
    <circle cx="250" cy="250" r="155.2" fill="none" stroke="url(#goldRimInner)" stroke-width="1.5" />
    <circle cx="250" cy="250" r="153.8" fill="url(#obsidianDiscGrad)" />
    <circle cx="250" cy="250" r="148" fill="none" stroke="#ffffff" stroke-width="0.45" stroke-opacity="0.12" />

    <g id="star-3d-faceted" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.75))">
      <polygon points="250,144 250,112 242.1,133.1" fill="url(#starFacetLight)" />
      <polygon points="250,144 250,112 257.9,133.1" fill="url(#starFacetDark)" />
      <polygon points="250,144 280.4,134.1 257.9,133.1" fill="url(#starFacetLight)" />
      <polygon points="250,144 280.4,134.1 262.8,148.2" fill="url(#starFacetDark)" />
      <polygon points="250,144 268.8,169.9 262.8,148.2" fill="url(#starFacetMid)" />
      <polygon points="250,144 268.8,169.9 250,157.5" fill="url(#starFacetDark)" />
      <polygon points="250,144 231.2,169.9 250,157.5" fill="url(#starFacetDark)" />
      <polygon points="250,144 231.2,169.9 237.2,148.2" fill="url(#starFacetMid)" />
      <polygon points="250,144 219.6,134.1 237.2,148.2" fill="url(#starFacetMid)" />
      <polygon points="250,144 219.6,134.1 242.1,133.1" fill="url(#starFacetLight)" />
    </g>

    <g filter="url(#letterDepthShadow)">
      <text x="250" y="268" class="emblem-ar-main" font-size="86" direction="rtl">س و ر</text>
    </g>

    <line x1="168" y1="304" x2="332" y2="304" stroke="#c5a880" stroke-width="1.2" stroke-opacity="0.7" />
    <g filter="drop-shadow(0 2px 3px rgba(0,0,0,0.8))">
      <text x="250" y="344" class="emblem-ar-sub" direction="rtl">كور سينك</text>
    </g>
  </g>
</svg>
