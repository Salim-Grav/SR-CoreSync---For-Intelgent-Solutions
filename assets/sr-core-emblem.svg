<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;display=swap');
      .sr-serif {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .sr-amp {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #c5a880;
      }
    </style>
    
    <!-- التدرجات الذهبية الشامبانية الملكية النقية عالية الوضوح -->
    <radialGradient id="officialCoreSphere" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#241d11" stop-opacity="0.98" />
      <stop offset="45%" stop-color="#121310" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#050806" stop-opacity="1" />
      <stop offset="100%" stop-color="#010403" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="officialGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4da" />
      <stop offset="50%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#8a673c" />
    </linearGradient>

    <linearGradient id="orbitalRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c5a880" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="nodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eedcc4" />
      <stop offset="100%" stop-color="#c5a880" />
    </radialGradient>
  </defs>
  
  <g>
    <!-- 1. الحلقة المدارية الخارجية الدقيقة (Outer Orbital Ring) -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#orbitalRingGrad)" stroke-width="0.9" stroke-opacity="0.75" />
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="#c5a880" stroke-width="0.5" stroke-dasharray="2 3" stroke-opacity="0.35" />

    <!-- 2. عقد التزامن المدارية الذكية (Sync Nodes) -->
    <g transform="rotate(-35 50 50) translate(95, 50)">
      <circle cx="0" cy="0" r="2.8" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="0.6" />
    </g>
    <g transform="rotate(145 50 50) translate(95, 50)">
      <circle cx="0" cy="0" r="2.8" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="0.6" />
    </g>

    <!-- 3. مدارات التزامن المتداخلة (Dual Synchronous Orbitals) -->
    <ellipse cx="50" cy="50" rx="44" ry="18" transform="rotate(35 50 50)" fill="none" stroke="url(#officialGoldBorder)" stroke-width="0.9" stroke-opacity="0.65" />
    <ellipse cx="50" cy="50" rx="44" ry="18" transform="rotate(-35 50 50)" fill="none" stroke="url(#officialGoldBorder)" stroke-width="0.9" stroke-opacity="0.65" />

    <!-- 4. الكرة المركزية الملكية الفاخرة ذات الإطار الذهبي المصقول -->
    <circle cx="50" cy="50" r="34" fill="url(#officialCoreSphere)" stroke="url(#officialGoldBorder)" stroke-width="1.6" />
    <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3" />

    <!-- 5. مونوغرام S&R المعتمد بالخط السيريف الأصلي الصحيح غير المقلوب -->
    <!-- حرف S الصحيح على اليسار -->
    <text x="38" y="58" class="sr-serif" font-size="28" text-anchor="middle">S</text>
    
    <!-- علامة الربط & بالذهب الشامباني في الوسط -->
    <text x="49.5" y="53" class="sr-amp" font-size="14.5" text-anchor="middle">&amp;</text>
    
    <!-- حرف R الصحيح على اليمين -->
    <text x="61.5" y="58" class="sr-serif" font-size="28" text-anchor="middle">R</text>

    <!-- نجمة البريق واللمعان الملكية في أعلى التاج -->
    <path d="M 50,20 L 51,22.5 L 53.5,23 L 51.5,24.5 L 52,27 L 50,25.5 L 48,27 L 48.5,24.5 L 46.5,23 L 49,22.5 Z" 
          fill="#ffffff" 
          opacity="0.95" />
  </g>
</svg>
