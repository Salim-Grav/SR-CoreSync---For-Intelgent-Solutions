<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" direction="rtl">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&amp;display=swap');

      .spec-bg { fill: #020705; }
      .text-title { font-family: 'Cairo', sans-serif; font-size: 32px; font-weight: 900; fill: #ffffff; }
      .text-sub { font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 600; fill: #c5a880; }
      .text-section { font-family: 'Cairo', sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; }
      .text-body { font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; fill: #a1a1aa; }
      .text-code { font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; fill: #e6ca9f; }
      .card-box { fill: #06110e; stroke: rgba(197, 168, 128, 0.25); stroke-width: 1.5; rx: 16px; }
      .swatch-border { stroke: rgba(255, 255, 255, 0.15); stroke-width: 1; rx: 10px; }
      .sr-serif { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 38px; fill: #ffffff; }
      .sr-amp { fill: #c5a880; }
      .sr-core { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 34px; fill: #ffffff; }
      .sr-sol { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 15px; fill: #c5a880; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051410" />
      <stop offset="60%" stop-color="#020705" />
      <stop offset="100%" stop-color="#010403" />
    </linearGradient>

    <linearGradient id="goldSpecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e9" />
      <stop offset="50%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#8c6f47" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bgGrad)" stroke="rgba(197, 168, 128, 0.35)" stroke-width="2" />
  <circle cx="1200" cy="0" r="320" fill="none" stroke="rgba(197, 168, 128, 0.08)" stroke-width="1.5" />
  <circle cx="1200" cy="0" r="460" fill="none" stroke="rgba(197, 168, 128, 0.05)" stroke-width="1" stroke-dasharray="8 12" />
  <circle cx="0" cy="800" r="350" fill="none" stroke="rgba(197, 168, 128, 0.06)" stroke-width="1.2" />

  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="210" height="28" rx="14" fill="rgba(197, 168, 128, 0.12)" stroke="rgba(197, 168, 128, 0.3)" />
    <circle cx="14" cy="14" r="4" fill="#c5a880" />
    <text x="190" y="19" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#e6ca9f" text-anchor="end">دليل الهوية المعتمد</text>

    <text x="580" y="65" class="text-title" text-anchor="end">إس آند آر كور سينك للحلول الذكية المتكاملة</text>
    <text x="580" y="92" class="text-sub" text-anchor="end">دليل ومعايير الهوية البصرية الرسمية — الإصدار المعتمد ٢٠٢٦</text>
  </g>

  <line x1="60" y1="185" x2="1140" y2="185" stroke="rgba(197, 168, 128, 0.2)" stroke-width="1" />

  <g transform="translate(60, 215)">
    <rect width="640" height="260" class="card-box" />
    <text x="610" y="38" class="text-section" text-anchor="end">١. الشعار الرسمي المتكامل والميدالية السيادية</text>

    <g transform="translate(40, 75)">
      <circle cx="55" cy="55" r="48" fill="#010504" stroke="#c5a880" stroke-width="1.5" />
      <circle cx="55" cy="55" r="40" fill="none" stroke="#c5a880" stroke-opacity="0.3" stroke-dasharray="4 6" />
      <text x="55" y="62" font-family="'Cairo', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">س و ر</text>

      <text x="520" y="52" class="sr-core" text-anchor="end">إس آند آر كور سينك</text>
      <line x1="130" y1="68" x2="520" y2="68" stroke="url(#goldSpecGrad)" stroke-width="1.5" />
      <text x="520" y="95" class="sr-sol" text-anchor="end">للحلول الذكية المتكاملة</text>
    </g>

    <text x="610" y="210" class="text-body" text-anchor="end">• مساحة الأمان الإلزامية: لا تقل عن ٢٠ بكسل حول الشعار.</text>
    <text x="610" y="235" class="text-body" text-anchor="end">• الاستخدام المعتمد: على الخلفيات الداكنة، والتقارير التنفيذية، والمنصات السحابية.</text>
  </g>

  <g transform="translate(730, 215)">
    <rect width="410" height="260" class="card-box" />
    <text x="380" y="38" class="text-section" text-anchor="end">٢. اللوحة اللونية المعتمدة</text>

    <g transform="translate(30, 60)">
      <rect width="70" height="42" fill="#c5a880" class="swatch-border" />
      <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="end">الذهب الشامباني الملكي</text>
      <text x="350" y="37" class="text-code" text-anchor="end">درجة اللون المرجعية: ١٩٧ - ١٦٨ - ١٢٨</text>
    </g>

    <g transform="translate(30, 115)">
      <rect width="70" height="42" fill="#020705" stroke="#c5a880" stroke-width="1" class="swatch-border" />
      <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="end">أسود الأوبسيديان الفاخر</text>
      <text x="350" y="37" class="text-code" text-anchor="end">درجة اللون المرجعية: ٢ - ٧ - ٥</text>
    </g>

    <g transform="translate(30, 170)">
      <rect width="70" height="42" fill="#041c14" stroke="#c5a880" stroke-width="1" class="swatch-border" />
      <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="end">الزمردي المؤسسي الداكن</text>
      <text x="350" y="37" class="text-code" text-anchor="end">درجة اللون المرجعية: ٤ - ٢٨ - ٢٠</text>
    </g>
  </g>

  <g transform="translate(60, 505)">
    <rect width="520" height="230" class="card-box" />
    <text x="490" y="38" class="text-section" text-anchor="end">٣. الخطوط والهوية المطبعية</text>

    <g transform="translate(30, 65)">
      <text x="460" y="16" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="end">الخط الهندسي السيادي للعناوين</text>
      <text x="460" y="38" class="text-body" text-anchor="end">العناوين الرئيسية، الشعارات الرسمية، وأسماء المنظومات البرمجية.</text>
    </g>

    <g transform="translate(30, 135)">
      <text x="460" y="16" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#c5a880" text-anchor="end">خط كايرو العربي المعتمد</text>
      <text x="460" y="38" class="text-body" text-anchor="end">النصوص العربية، الواجهات السحابية، والتقارير المالية والتحليلية.</text>
    </g>
  </g>

  <g transform="translate(610, 505)">
    <rect width="530" height="230" class="card-box" />
    <text x="500" y="38" class="text-section" text-anchor="end">٤. الترخيص والحماية المؤسسية</text>
    <text x="500" y="75" class="text-body" text-anchor="end">• الشركة: إس آند آر كور سينك للحلول الذكية المتكاملة</text>
    <text x="500" y="105" class="text-body" text-anchor="end">• المقر الرئيسي: كايزرسخراخت، أمستردام، مملكة هولندا</text>
    <text x="500" y="135" class="text-body" text-anchor="end">• التخصص: هندسة وتطوير الأنظمة السحابية والحلول المالية وتخطيط الموارد</text>
    <text x="500" y="165" class="text-body" text-anchor="end">• الاستخدام غير المصرح به أو التعديل على الشعار محظور قانوناً.</text>

    <g transform="translate(30, 120)">
      <circle cx="45" cy="45" r="38" fill="rgba(197, 168, 128, 0.08)" stroke="#c5a880" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="45" y="42" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#c5a880" text-anchor="middle">معتمد</text>
      <text x="45" y="58" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">٢٠٢٦</text>
    </g>
  </g>
</svg>
